<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#20406b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="내 자료 허브">
<link rel="manifest" href="manifest.json">
<title>나만의 북마크·캡처 허브</title>
<style>
  :root{
    --bg:#f2f4f8;
    --card:#ffffff;
    --ink:#1b2430;
    --ink-soft:#5a6575;
    --line:#e1e6ef;
    --accent:#20406b;
    --accent-deep:#152c49;
    --accent-soft:#e8eef7;

    /* 3대 영역 컬러 */
    --sp-ai:#20406b;       --sp-ai-bg:#e6edf7;
    --sp-edu:#1d6b52;      --sp-edu-bg:#e3f3ec;
    --sp-per:#7a3e65;      --sp-per-bg:#f5e8f0;

    /* 세부 분류 컬러 */
    --c-must:#20406b;      --c-must-bg:#e6edf6;
    --c-ref:#49596b;       --c-ref-bg:#eaeff5;
    --c-prompt:#4b3c82;    --c-prompt-bg:#edeaf7;
    --c-dev:#627080;       --c-dev-bg:#eef1f5;

    --c-kor:#1d6b52;       --c-kor-bg:#e3f3ec;
    --c-eval:#226472;      --c-eval-bg:#e4f2f5;
    --c-class:#2f6846;     --c-class-bg:#e6f3eb;
    --c-eduref:#4d6b5b;    --c-eduref-bg:#eaf1ed;

    --c-life:#7a3e65;      --c-life-bg:#f5e8f0;
    --c-family:#8c4a32;    --c-family-bg:#f7ebe6;
    --c-read:#5d467e;      --c-read-bg:#efeaf6;
    --c-hobby:#855b26;     --c-hobby-bg:#f7f0e4;

    --shadow:0 6px 20px rgba(20,35,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.62;
  }
  .wrap{max-width:920px; margin:0 auto; padding:18px 16px 130px; min-height:100%;}

  /* Header */
  header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:11px;}
  .brand .ava{width:44px; height:44px; border-radius:50%; overflow:hidden; flex:0 0 auto; border:1px solid var(--line); background:var(--accent-soft);}
  .brand .ava img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand .btxt{font-weight:800; letter-spacing:-.02em; font-size:1.04rem; line-height:1.25;}
  .brand small{display:block; font-weight:500; color:var(--ink-soft); font-size:.77rem; letter-spacing:0; margin-top:2px;}
  .top-actions{display:flex; align-items:center; gap:7px; flex-wrap:wrap;}
  .counter{font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.82rem; background:var(--card); border:1px solid var(--line); padding:6px 11px; border-radius:999px; font-weight:600;}

  .addbtn{border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:8px 14px; font-size:.84rem; font-weight:700; cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; gap:5px; transition:.15s;}
  .addbtn:hover{background:var(--accent-deep);}
  .addbtn.cap{background:#185a46; border-color:#185a46;}
  .addbtn.cap:hover{background:#104233;}
  .addbtn.ghost{background:var(--card); color:var(--ink); border-color:var(--line);}
  .addbtn.ghost:hover{border-color:var(--accent); color:var(--accent);}

  /* Card */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:24px 24px 30px; min-height:60vh;
    animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

  /* 3대 영역 대분류 탭 (Spaces) */
  .space-bar{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:14px;}
  .space-btn{
    font-family:inherit; border:1px solid var(--line); background:#f7f9fc; color:var(--ink-soft);
    border-radius:14px; padding:11px 8px; cursor:pointer; text-align:center; transition:.15s;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .space-btn .sp-title{font-size:.9rem; font-weight:800; display:flex; align-items:center; gap:4px;}
  .space-btn .sp-sub{font-size:.73rem; opacity:.82; font-weight:600;}
  .space-btn:hover{border-color:var(--accent); color:var(--ink);}
  .space-btn.on{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 12px rgba(32,64,107,.18);}
  .space-btn.on[data-sp="edu"]{background:var(--sp-edu); border-color:var(--sp-edu); box-shadow:0 4px 12px rgba(29,107,82,.18);}
  .space-btn.on[data-sp="personal"]{background:var(--sp-per); border-color:var(--sp-per); box-shadow:0 4px 12px rgba(122,62,101,.18);}

  /* 모바일 빠른 추가 배너 */
  .quick-bar{
    display:grid; grid-template-columns:1.25fr 1fr; gap:8px; margin-bottom:14px;
  }
  .qbtn{
    font-family:inherit; border:1px dashed #b9c6da; background:#f5f8fc; color:var(--ink);
    border-radius:14px; padding:12px 14px; cursor:pointer; display:flex; align-items:center; gap:10px;
    text-align:left; transition:.15s;
  }
  .qbtn:hover{border-color:var(--accent); background:var(--accent-soft);}
  .qbtn.primary{border-style:solid; border-color:#bee0d4; background:#eef8f4;}
  .qbtn.primary:hover{border-color:var(--sp-edu); background:#e1f3ec;}
  .qbtn .qico{font-size:1.45rem; line-height:1;}
  .qbtn .qtxt b{display:block; font-size:.9rem; font-weight:800;}
  .qbtn .qtxt span{display:block; font-size:.76rem; color:var(--ink-soft);}

  /* 세부 분류 탭 */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
  .tabs button{font-family:inherit; font-size:.84rem; font-weight:700; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:7px 13px; cursor:pointer; min-height:36px; transition:.15s;}
  .tabs button:hover{border-color:var(--accent); color:var(--accent);}
  .tabs button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
  .tabs button.star-tab.on{background:#b7791f; border-color:#b7791f; color:#fff;}
  .tabs button small{font-weight:600; opacity:.75; margin-left:3px;}

  /* 말로 찾기 / 검색 */
  .ask{background:var(--accent-soft); border:1px solid var(--line); border-radius:16px; padding:13px 14px 12px; margin-bottom:14px;}
  .ask label{display:block; font-weight:800; font-size:.88rem; margin-bottom:7px; color:var(--accent-deep);}
  .askrow{display:flex; gap:7px;}
  .askrow input{flex:1; min-width:0; font-family:inherit; font-size:.95rem; border:1px solid var(--line); border-radius:11px; padding:10px 13px; outline:none; background:#fff;}
  .askrow input:focus{border-color:var(--accent);}
  .askrow button{white-space:nowrap; padding:0 16px; font-size:.88rem;}
  .chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .chiprow button{border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 11px; font-size:.78rem; cursor:pointer; font-family:inherit; color:var(--ink-soft);}
  .chiprow button:hover{border-color:var(--accent); color:var(--accent);}

  /* 배지 스타일 */
  .chip, .mini{display:inline-flex; align-items:center; gap:5px; font-weight:700; border-radius:999px;}
  .chip{font-size:.76rem; padding:5px 11px; margin-bottom:12px; margin-right:6px;}
  .mini{font-size:.71rem; padding:3px 8px;}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .sp-ai{color:var(--sp-ai); background:var(--sp-ai-bg);}
  .sp-edu{color:var(--sp-edu); background:var(--sp-edu-bg);}
  .sp-personal{color:var(--sp-per); background:var(--sp-per-bg);}

  .must{color:var(--c-must); background:var(--c-must-bg);}
  .ref{color:var(--c-ref); background:var(--c-ref-bg);}
  .prompt{color:var(--c-prompt); background:var(--c-prompt-bg);}
  .dev{color:var(--c-dev); background:var(--c-dev-bg);}
  .kor{color:var(--c-kor); background:var(--c-kor-bg);}
  .eval{color:var(--c-eval); background:var(--c-eval-bg);}
  .class{color:var(--c-class); background:var(--c-class-bg);}
  .eduref{color:var(--c-eduref); background:var(--c-eduref-bg);}
  .life{color:var(--c-life); background:var(--c-life-bg);}
  .family{color:var(--c-family); background:var(--c-family-bg);}
  .read{color:var(--c-read); background:var(--c-read-bg);}
  .hobby{color:var(--c-hobby); background:var(--c-hobby-bg);}

  .mini.new{color:#fff; background:var(--accent);}
  .mini.cap{color:#155e48; background:#d8f3e9;}
  .mini.tag{color:var(--ink-soft); background:#f1f3f7; font-weight:600;}

  /* 목록 아이템 */
  .listwrap{animation:fade .18s ease;}
  .item-card{
    position:relative; display:flex; align-items:stretch; justify-content:space-between; gap:12px;
    width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:15px 16px; margin-bottom:10px; transition:.15s;
  }
  .item-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .item-main{flex:1; min-width:0; cursor:pointer;}
  .rtop{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap;}
  .rtitle{display:block; font-weight:800; font-size:1.03rem; letter-spacing:-.01em; margin-bottom:3px; color:var(--ink); word-break:keep-all;}
  .rone{color:var(--ink-soft); font-size:.89rem; line-height:1.48; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .rtags{display:flex; gap:5px; flex-wrap:wrap; margin-top:7px;}
  .rno{font-size:.75rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .item-side{display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; gap:8px; flex:0 0 auto;}
  .item-actions{display:flex; align-items:center; gap:5px;}
  .icon-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:9px;
    width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:.92rem; text-decoration:none; transition:.15s;
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}
  .icon-btn.starred{color:#d97706; border-color:#f3d19e; background:#fffbeb;}
  .thumb-mini{width:64px; height:64px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#f5f7fa; flex:0 0 auto; cursor:pointer;}
  .thumb-mini img{width:100%; height:100%; object-fit:cover; display:block;}

  /* 상세 화면 */
  .dtop{display:flex; gap:7px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:14px;}
  .dtop-right{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .dtop button, .dtop a{font-family:inherit; font-size:.84rem; font-weight:700; text-decoration:none; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; min-height:38px; display:inline-flex; align-items:center; gap:4px;}
  .dtop a.open{background:var(--accent); border-color:var(--accent); color:#fff;}
  .dtop button.danger:hover{border-color:#c53030; color:#c53030;}
  .dtop button:hover{border-color:var(--accent); color:var(--accent);}

  h1.title{font-size:1.55rem; letter-spacing:-.02em; line-height:1.28; margin-bottom:9px; font-weight:800;}
  .oneline{font-size:1rem; color:var(--ink-soft); margin-bottom:18px;}

  /* 캡처 갤러리 */
  .cap-gallery{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; margin:14px 0 18px; background:#f6f8fb; padding:12px; border-radius:14px; border:1px solid var(--line);}
  .cap-item{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#fff; aspect-ratio:3/4; cursor:zoom-in;}
  .cap-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .cap-item span{position:absolute; right:6px; bottom:6px; background:rgba(0,0,0,.65); color:#fff; font-size:.7rem; padding:2px 7px; border-radius:99px;}

  .sec{margin-top:20px;}
  .sec h3{
    font-size:.82rem; font-weight:800; color:var(--accent); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:9px; display:flex; align-items:center; gap:8px;
  }
  .sec h3::before{content:""; width:14px; height:2px; background:var(--accent); border-radius:2px;}
  .sec p{margin-bottom:8px; white-space:pre-line;}
  .sec ul{list-style:none;}
  .sec ul li{position:relative; padding-left:18px; margin-bottom:8px;}
  .sec ul li::before{content:""; position:absolute; left:4px; top:.62em; width:6px; height:6px; background:var(--accent); border-radius:50%;}

  ol.steps{list-style:none; counter-reset:s;}
  ol.steps li{position:relative; padding-left:36px; margin-bottom:11px; counter-increment:s;}
  ol.steps li::before{
    content:counter(s); position:absolute; left:0; top:-1px; width:25px; height:25px;
    background:var(--accent-soft); color:var(--accent); border-radius:8px; font-weight:800;
    font-size:.82rem; display:flex; align-items:center; justify-content:center;
  }
  code{background:#eef1f5; padding:1.5px 6px; border-radius:6px; font-size:.86em; font-family:"SFMono-Regular",Consolas,monospace; color:#20406b; word-break:break-all;}

  /* 프롬프트 박스 + 복사 버튼 */
  .prompt-wrap{position:relative; margin:6px 0 12px;}
  .prompt{background:#1b2a40; color:#dbe4f0; border-radius:12px; padding:14px 16px; font-size:.88rem; white-space:pre-wrap; font-family:"SFMono-Regular",Consolas,monospace; line-height:1.55;}
  .copy-btn{position:absolute; top:8px; right:8px; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:4px 10px; font-size:.76rem; font-weight:700; cursor:pointer; font-family:inherit;}
  .copy-btn:hover{background:rgba(255,255,255,.25);}
  details{border:1px solid var(--line); border-radius:12px; padding:2px 14px; margin-top:9px; background:#f5f7fa;}
  details summary{cursor:pointer; font-weight:700; padding:11px 0; font-size:.9rem; list-style:none;}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ "; color:var(--accent);}
  details[open] summary::before{content:"▾ ";}

  .caution{background:#f1f4f8; border:1px solid #e3e7ee; border-left:3px solid var(--accent); border-radius:12px; padding:12px 14px; margin-top:8px; font-size:.9rem;}
  .caution strong{color:var(--accent-deep);}

  .links a{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-weight:600; font-size:.9rem; border:1px solid var(--line); padding:8px 13px; border-radius:10px; margin:5px 8px 0 0; background:#fff; word-break:break-all;}
  .links a:hover{background:var(--accent-soft); border-color:var(--accent);}

  /* 하단 내비 & 모바일 플로팅 바 */
  nav.bottom{position:fixed; left:0; right:0; bottom:0; background:rgba(242,244,248,.94); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:10px 16px; z-index:20;}
  nav.bottom .inner{max-width:920px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  nav.bottom button{font-family:inherit; font-weight:700; font-size:.9rem; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:10px 18px; border-radius:12px; cursor:pointer;}
  nav.bottom button:disabled{opacity:.38; cursor:default;}
  nav.bottom .mid{font-size:.8rem; color:var(--ink-soft); text-align:center;}

  .fab-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:25;
    display:flex; gap:8px; background:rgba(27,36,48,.92); backdrop-filter:blur(10px);
    padding:7px 9px; border-radius:999px; box-shadow:0 8px 26px rgba(15,25,40,.28);
  }
  .fab-bar button{
    font-family:inherit; border:none; border-radius:999px; padding:10px 16px;
    font-size:.86rem; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .fab-bar .fab-cap{background:#1ec28b; color:#092b1f;}
  .fab-bar .fab-link{background:#ffffff; color:#1b2430;}

  /* 모달 공통 */
  dialog.modal{margin:auto; max-height:92vh; overflow:auto; border:none; border-radius:18px; padding:20px 20px 18px; width:min(480px,94vw); box-shadow:0 14px 44px rgba(0,0,0,.28); font-family:inherit; color:var(--ink);}
  dialog.modal::backdrop{background:rgba(0,0,0,.45);}
  dialog.modal h3{margin:0 0 4px; font-size:1.12rem; font-weight:800;}
  dialog.modal p.hint{margin:0 0 12px; color:var(--ink-soft); font-size:.82rem; line-height:1.48;}
  dialog.modal label{display:block; font-size:.8rem; font-weight:700; margin:10px 0 4px; color:var(--ink);}
  dialog.modal input, dialog.modal select, dialog.modal textarea{width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:.92rem; font-family:inherit; background:#fff;}
  dialog.modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  dialog.modal .url-row{display:flex; gap:6px;}
  dialog.modal .url-row input{flex:1;}
  dialog.modal .paste-btn{border:1px solid var(--line); background:#f5f7fa; border-radius:10px; padding:0 11px; font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit;}
  dialog.modal .btns{display:flex; gap:8px; justify-content:flex-end; margin-top:14px;}
  dialog.modal .btns button{border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 16px; font-weight:700; cursor:pointer; font-family:inherit; font-size:.9rem;}
  dialog.modal .btns button.go{background:var(--accent); color:#fff; border-color:var(--accent);}
  dialog.modal .btns button:disabled{opacity:.6; cursor:wait;}

  /* 캡처 업로드 박스 */
  .dropzone{
    border:2px dashed #9ab0cf; background:#f4f8fd; border-radius:14px; padding:16px 12px;
    text-align:center; cursor:pointer; transition:.15s; margin-bottom:8px;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--accent); background:#e8f0fb;}
  .dropzone .dz-ico{font-size:1.7rem; line-height:1; margin-bottom:4px;}
  .dropzone .dz-title{font-weight:800; font-size:.92rem; color:var(--accent-deep);}
  .dropzone .dz-sub{font-size:.77rem; color:var(--ink-soft); margin-top:2px;}
  .preview-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:8px;}
  .pv-item{position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#fff;}
  .pv-item img{width:100%; height:100%; object-fit:cover; display:block;}
  .pv-item button{position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(0,0,0,.68); color:#fff; font-weight:800; font-size:.78rem; cursor:pointer;}

  .status-msg{min-height:1.2em; margin-top:9px; font-size:.84rem; color:var(--ink-soft); font-weight:600;}
  .status-msg.err{color:#b3261e;}

  /* 이미지 확대 라이트박스 */
  dialog.lightbox{margin:auto; border:none; background:transparent; max-width:96vw; max-height:94vh; padding:0;}
  dialog.lightbox::backdrop{background:rgba(0,0,0,.82);}
  .lb-inner{position:relative; display:flex; flex-direction:column; align-items:center;}
  .lb-inner img{max-width:94vw; max-height:86vh; object-fit:contain; border-radius:10px; background:#fff;}
  .lb-close{margin-top:10px; border:none; background:#fff; color:#1b2430; font-weight:800; padding:8px 18px; border-radius:999px; cursor:pointer; font-family:inherit;}

  .results{animation:fade .2s ease;}
  .results .rhead{color:var(--ink-soft); font-size:.9rem; margin-bottom:12px; padding:0 2px;}
  .results .rhead b{color:var(--accent);}
  .why-match{margin-top:6px; font-size:.8rem; color:var(--accent-deep);}
  .ainote{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:10px;}
  .backlist{font-family:inherit; font-size:.86rem; font-weight:700; border:1px solid var(--line); background:#fff; border-radius:10px; padding:8px 14px; cursor:pointer; margin-bottom:12px;}
  .noresult{text-align:center; color:var(--ink-soft); padding:40px 18px; background:var(--card); border:1px solid var(--line); border-radius:16px;}
  .noresult .big{font-size:1.6rem; margin-bottom:8px;}

  @media (max-width:600px){
    .card{padding:18px 14px 24px;}
    h1.title{font-size:1.35rem;}
    .wrap{padding:14px 12px 130px;}

`앞 단계에서 내가 채택한 공통 조판 원칙과 확정된 내용·관계 계약을 바탕으로, 시각 테마를 조사하고 비교할 HTML 테마 조절기를 만들어 줘.
[테마와 글꼴 조사]
1. 실제 인쇄 교육자료·문서 견본에서 글꼴, 본문색·배경색·악센트 컬러, 선·배경 강조, 장식, 정보 밀도를 살펴보고 출처와 가져올/제외할 요소를 밝혀.
2. 분위기가 다른 테마 후보 3개를 만들어. 공통 조판 원칙과 충돌하는 권고는 이유를 밝혀 제외해.
3. 기본 글꼴은 큰 제목 SUIT, 나머지 모든 텍스트 Pretendard. 역할 차이는 크기·굵기·간격으로 표현하고, 계약에 없는 역할은 만들지 마.
4. 오픈소스 한글 글꼴의 제목용·본문용 대안 조합 2쌍을 조사해 추천해(공식 배포처, 라이선스, 굵기, 필요한 문자, 로컬 파일 제공 여부 확인). 인기도를 인쇄 적합성의 근거로 삼지 마.
[HTML 비교·조절]
5. 같은 예시 내용으로 테마 후보와 글꼴 조합을 비교하게 해.
6. 조화를 만드는 핵심 값은 고정하고, 바꿔도 조화가 유지되는 변수만 노출해.
7. 긴 한글 문장·숫자·괄호·표를 포함하고, 글립·굵기·라이선스·임베딩·PDF 재현성을 검사해.
8. 값을 바꾸는 동안 LLM을 다시 호출하지 않게 하고, 확정하면 theme-config.json과 theme.css로 내보내게 해.
컴포넌트의 최종 내부 디자인과 페이지 조합은 아직 만들지 마.`},
      {label:"⑤ 컴포넌트 HTML 시안 A/B/C", body:
`앞 단계에서 컴포넌트 목록과 내용·관계 계약, 글로벌 디자인 원칙, 내가 선택한 시각 테마를 모두 확정했다. 이를 바탕으로 학습지 컴포넌트의 실제 HTML·CSS 시안을 만들어 줘.
1. 모든 컴포넌트가 공유할 디자인 토큰을 코드로 정의해.
2. 확정된 필드를 변경하거나 새로 추가하지 마.
3. 같은 예시 내용을 사용한 시안 A/B/C를 하나의 HTML에서 비교할 수 있게 해.
4. 내용이 짧은 경우와 긴 경우를 모두 넣어 모양이 무너지지 않는지 확인해.
5. 페이지 전체 구성과 페이지 나눔은 아직 만들지 마.
6. 이미 결정된 내용을 다시 묻지 말고, 안전한 범위 안에서 가장 일관된 방향으로 구현해.
결과로 공통 디자인 토큰, 컴포넌트별 HTML·CSS, 시안 비교 HTML, 적용한 판단, 계약과 충돌한 항목을 보고해.`},
      {label:"⑥ 제작 지시서 + 조립 파이프라인", body:
`지금까지 확정한 컴포넌트·내용 계약·HTML 렌더러를 연결해, 수업 자료를 넣으면 반복해서 학습지를 만들 수 있는 조립 파이프라인을 만들어 줘.
1. LLM이 작성할 '학습지 제작 지시서'의 데이터 형식을 만들어.
2. 이미 확정된 컴포넌트와 필드만 허용해.
3. 필수 내용의 누락, 허용되지 않은 필드, 포함·순서·참조 관계를 검사하는 코드를 만들어.
4. 검사를 통과한 지시서만 승인된 HTML 컴포넌트에 연결해.
5. 지시서 순서대로 조립하되, ID와 참조로 의미 관계를 보존해.
6. 각 A4 페이지에 data-page-id, 각 컴포넌트에 data-component-id를 넣어 다음 배치 검수가 문제 위치를 찾을 수 있게 해.
7. 한 번의 명령으로 내용·관계 검사와 기본 HTML 생성을 실행할 수 있게 해.
첫 버전은 A4 세로, 지시서 순서대로 배치, 허용된 위치에서만 페이지 나누기로 제한해. 완성 후 예시 지시서로 기본 HTML이 생성되는 과정을 보여 줘. 이 HTML은 배치 검수를 통과하기 전에는 최종본으로 처리하지 마.`},
      {label:"⑦ 배치 게이트 + 제한된 수정 루프", body:
`방금 만든 HTML 파이프라인에 렌더링 후 배치 게이트와 제한된 수정 루프를 추가해 줘.
1. 글꼴과 이미지가 모두 로딩된 뒤 실제 브라우저 레이아웃을 측정해.
2. 각 A4 페이지의 콘텐츠 영역 기준으로 가로·세로 넘침, 페이지 밖 요소, 잘린 텍스트, 허용되지 않은 페이지 분리를 검사해.
3. 오류마다 data-page-id, data-component-id, 유형, 넘친 방향과 크기를 구조화된 결과로 남겨.
4. 오류가 하나라도 있으면 검사 명령을 실패로 종료하고, 통과 전에는 PDF를 최종 결과로 처리하지 마.
5. 실패하면 현재 승인된 내용·관계·컴포넌트·페이지 나누기 규칙 안에서만 수정해.
6. 재시도는 최대 3회, 매 회차의 오류·수정·검사 결과를 기록해.
7. 같은 오류가 반복되거나 해결할 수 없으면 자동 수정을 멈추고 원인과 필요한 결정을 보고해.
8. 글자 크기·행간·여백 축소, 내용 삭제·요약, overflow: hidden, 승인되지 않은 컴포넌트 추가로 통과시키지 마.
내용·관계 검사 → HTML 생성 → 배치 검수 → 수정·재검사 → PDF 생성을 한 번의 명령으로 실행하게 하고, 정상 자료와 일부러 넘치는 자료로 통과·실패 결과를 보여 줘.`},
      {label:"⑧ 기존 자료·새 자료로 실제 검증", body:
`현재 완성된 A4 학습지 스킬을 실제 수업 자료로 검증해 줘.
1. 스킬을 만들 때 쓴 기존 자료 하나를 다시 제작해 의미, 컴포넌트, 필드, 관계, 승인한 디자인이 재현되는지 확인해.
2. 같은 과목의 새 자료 하나를 넣어 별도의 임의 규칙 없이 학습지가 생성되는지 확인해.
3. 내용·관계 검사와 배치 검사를 실행하고 결과를 구분해 기록해.
4. 생성된 HTML과 PDF에서 텍스트 누락, 잘림, 넘침, 이미지·링크 오류가 없는지 확인해.
5. 자동 검사와 별도로 교사가 확인할 의미 보존, 문항 흐름, 읽기 편의성, 답안 공간을 짧은 체크리스트로 정리해.
6. 문제가 있으면 원본 자료, 제작 지시서, 컴포넌트 계약, 렌더러, 배치 규칙 중 어디서 생겼는지 구분해.
7. 승인된 규칙 안에서 고칠 수 있는 것만 고치고 다시 검사해. 새 규칙이 필요하면 임의로 추가하지 말고 필요한 결정만 질문해.
마지막에 기존 자료와 새 자료의 검사 결과, 수정 내용, 남은 확인 항목을 표로 정리해.`}

resources.forEach((r, i) => {
  r.builtinKey = 'builtin_' + i;
  if (!r.space) r.space = 'ai';
  if (r.cat === 'ref' && /스킬|치트키/.test(r.title)) r.cat = 'prompt';
});

// 로컬 즐겨찾기(별표) 저장소
function getLocalStars(){
  try { return JSON.parse(localStorage.getItem('jaryoStars') || '{}'); } catch(e) { return {}; }
}
function setLocalStar(key, val){
  try {
    const s = getLocalStars();
    if (val) s[key] = true; else delete s[key];
    localStorage.setItem('jaryoStars', JSON.stringify(s));
  } catch(e){}
}
function isStarred(r){
  const key = r.id || r.builtinKey;
  const local = getLocalStars();
  if (key && local[key] !== undefined) return Boolean(local[key]);
  return Boolean(r.starred);
}

let total = resources.length + 1;
let idx = hashIdx_init();
function hashIdx_init(){ const m=/^#r(\d+)$/.exec(location.hash); const n=m?parseInt(m[1]):0; return n<=resources.length? n:0; }

const card = document.getElementById('card');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const navEl = document.getElementById('bottomNav');
const fabBar = document.getElementById('fabBar');
const resultsEl = document.getElementById('results');

const AVA_IMG = `<img src="${AVA_SRC}" alt="선생님 캐릭터">`;

let curSpace = 'all';
let filter = 'all';
let onlyStarred = false;
let askText = '';

function getCatsForSpace(sp){
  if (sp === 'all') return [];
  return Object.entries(CAT).filter(([k, v]) => v.space === sp);
}

function homeHTML(){
  const countSpace = sp => sp === 'all' ? resources.length : resources.filter(r => (r.space || 'ai') === sp).length;
  const inSpace = resources.map((r, i) => ({ r, i })).filter(x => curSpace === 'all' || (x.r.space || 'ai') === curSpace);
  const starCount = inSpace.filter(x => isStarred(x.r)).length;

  const subCats = getCatsForSpace(curSpace);
  const tabs = [['all', '전체', inSpace.length]].concat(
    subCats.map(([k, v]) => [k, v.label, inSpace.filter(x => x.r.cat === k).length])
  );

  const rows = inSpace.filter(x => {
    if (onlyStarred && !isStarred(x.r)) return false;
    if (filter !== 'all' && x.r.cat !== filter) return false;
    return true;
  });

  // 정렬: 즐겨찾기(★) 우선 -> 새로 추가한 자료(최신순) -> 기본 자료
  rows.sort((a, b) => {
    const sa = isStarred(a.r) ? 1 : 0, sb = isStarred(b.r) ? 1 : 0;
    if (sa !== sb) return sb - sa;
    const aa = a.r.added ? 1 : 0, ab = b.r.added ? 1 : 0;
    if (aa !== ab) return ab - aa;
    if (a.r.added && b.r.added) return b.i - a.i;
    return a.i - b.i;
  });

  return `
    <div class="space-bar">
      ${Object.entries(SPACES).map(([k, sp]) => `
        <button type="button" class="space-btn ${curSpace===k?'on':''}" data-sp="${k}">
          <span class="sp-title">${sp.icon} ${sp.label} <small>(${countSpace(k)})</small></span>
          <span class="sp-sub">${sp.desc}</span>
        </button>
      `).join('')}
    </div>

    <div class="quick-bar">
      <button type="button" class="qbtn primary" id="homeCapBtn">
        <span class="qico">📸</span>
        <span class="qtxt">
          <b>캡처 이미지로 바로 추가</b>
          <span>휴대폰 캡처·인스타 카드뉴스를 AI가 읽고 자동 기록</span>
        </span>
      </button>
      <button type="button" class="qbtn" id="homeLinkBtn">
        <span class="qico">📝</span>
        <span class="qtxt">
          <b>링크 · 텍스트 메모 추가</b>
          <span>웹 링크나 복사한 글·아이디어 메모 저장</span>
        </span>
      </button>
    </div>

    <form class="ask" id="askForm">
      <label for="askQ">🧭 모아둔 자료에서 말로 찾기</label>
      <div class="askrow">
        <input id="askQ" type="text" value="${esc(askText)}" placeholder="예: 생기부 세특 프롬프트, 수행평가, PPT 색조합…" autocomplete="off">
        <button class="addbtn" type="submit">찾기</button>
      </div>
      <div class="chiprow">
        ${['생기부 세특','수업 지도안','PPT 디자인','글쓰기 다듬기','학습지 만들기'].map(k=>`<button type="button" data-ex="${k}">${k}</button>`).join('')}
      </div>
    </form>

    <div class="tabs">
      ${tabs.map(t=>`<button type="button" data-f="${t[0]}" class="${!onlyStarred && filter===t[0]?'on':''}">${t[1]}<small>${t[2]}</small></button>`).join('')}
      <button type="button" class="star-tab ${onlyStarred?'on':''}" id="starFilterBtn">⭐ 즐겨찾기<small>${starCount}</small></button>
    </div>

    ${rows.length === 0 ? `
      <div class="noresult">
        <div class="big">${curSpace==='edu'?'🏫':curSpace==='personal'?'🌿':'🗂️'}</div>
        <b>아직 이 분류에 저장된 자료가 없어요.</b><br>
        휴대폰에서 캡처한 이미지나 링크를 <b>[📸 캡처 추가]</b> 버튼으로 올려 보세요!
      </div>
    ` : `
      <div class="listwrap list">${rows.map(({r,i})=>{
        const c = CAT[r.cat] || CAT.ref;
        const sp = SPACES[r.space || c.space || 'ai'] || SPACES.ai;
        const starred = isStarred(r);
        const firstLink = r.links && r.links[0] && r.links[0].u && r.links[0].u !== '#';
        const thumb = r.thumbs && r.thumbs[0];
        const isCap = r.sourceType === 'capture' || Boolean(thumb);
        return `<div class="item-card">
          <div class="item-main" data-go="${i+1}">
            <div class="rtop">
              <span class="mini ${sp.cls}">${sp.icon} ${sp.short}</span>
              <span class="mini ${c.cls}">${c.label}</span>
              ${isCap ? '<span class="mini cap">📸 캡처</span>' : ''}
              ${r.added ? `<span class="mini new">${r.date || '추가됨'}</span>` : `<span class="rno">#${i+1}</span>`}
            </div>

function stripTags(s){ return String(s||'').replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim(); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getSavedPin(){ try{ return localStorage.getItem('jaryoPin')||''; }catch(e){ return ''; } }

/* ---------- 말로 찾기 (설명에 맞는 자료 추천) ---------- */
const JOSA = ['으로','에서','에게','까지','부터','이랑','처럼','보다','한테','하고','라고','를','을','은','는','이','가','에','로','와','과','도','의','만','랑'];
const STOP = ['만들','싶','해줘','해주','하는','하고','할때','필요','어떻게','알려','자료','있','좋','추천','도움','방법','빨리','쉽게','어떤','뭐','무엇','관련','대한','위한','때','걸','수','것','저','제','좀','도와'];
const SYN = [
  ['생기부','세특','생활기록','교과세특','학생부','행발','특기사항','관찰'],
  ['ppt','피피티','슬라이드','발표','프레젠테이션','파워포인트','pptx'],
  ['학부모','안내문','가정통신','알림장','공지','통신문'],
  ['지도안','수업','교안','차시','학습목표','성취기준'],
  ['평가','채점','평가계획','수행평가','루브릭','서술형'],
  ['문제','퀴즈','시험','문제집','출제','시험범위','기출'],
  ['학습지','워크시트','활동지','a4','인쇄'],
  ['노션','notion'],
  ['엑셀','xlsx','성적','paps','체력','스프레드시트','표'],
  ['글쓰기','글','문서','보고서','공문','문장','작문','요약'],
  ['디자인','카드뉴스','색','색조합','글씨체','폰트','예쁘','이미지','갤러리'],
  ['캡처','스크린샷','화면'],
  ['코딩','개발','터미널','클로드코드','claude code','프로그래밍','코드'],
  ['예약','자동','반복','스케줄','자동화'],
  ['무료','공짜','무료플랜'],
  ['스킬','skill','프롬프트','치트키'],
  ['notebooklm','노트북lm','노트북엘엠','가이드북']
];
function parseAsk(q){
  const raw = q.toLowerCase().replace(/[^0-9a-z가-힣\s]/g,' ').split(/\s+/).filter(Boolean);
  const terms = [];
  raw.forEach(w=>{
    let t = w;
    for(const j of JOSA){ if(t.length>j.length+1 && t.endsWith(j)){ t = t.slice(0,-j.length); break; } }
    if(t.length<2 && !/^[a-z0-9]$/.test(t)) return;
    if(STOP.some(st=>t.startsWith(st))) return;
    if(!terms.includes(t)) terms.push(t);
  });
  const syn = [];
  terms.forEach(t=>SYN.forEach(g=>{
    if(g.some(m=>t===m || (m.length>=2 && t.includes(m)) || (t.length>=2 && m.includes(t)))){
      g.forEach(m=>{ if(!terms.includes(m) && !syn.includes(m)) syn.push(m); });
    }
  }));
  return { terms, syn };
}
function fieldsOf(r){
  const j = a=>stripTags((a||[]).join(' ')).toLowerCase();
  return [
    [5, stripTags(r.title).toLowerCase() + ' ' + j(r.tags)],
    [3, stripTags(r.oneline).toLowerCase() + ' ' + stripTags(r.memo).toLowerCase()],
    [2, stripTags(r.what).toLowerCase()],
    [1, j(r.why)+' '+j(r.steps)+' '+j(r.notes)+' '+j((r.extra||[]).flatMap(x=>x.items||[]))+' '+stripTags((r.prompts||[]).map(p=>p.label+' '+p.body).join(' ')).toLowerCase()]
  ];
}
let askSeq = 0;
function showPicks(q, picks, note){
  card.hidden = true; resultsEl.hidden = false; navEl.style.display = 'none'; fabBar.style.display = 'none';
  const back = `<button class="backlist" id="askBack">← 목록으로</button>`;
  const noteHTML = note ? `<div class="rhead ainote">${note}</div>` : '';
  if(!picks.length){
    resultsEl.innerHTML = back + noteHTML + `<div class="noresult"><div class="big">🧭</div>
      "<b>${esc(q)}</b>"에 딱 맞는 자료를 찾지 못했어요.<br>다른 표현으로 다시 설명해 보세요.
      <div class="chiprow">${['프롬프트','PPT','생기부','수업','평가','무료'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`;
  } else {
    resultsEl.innerHTML = back + noteHTML + `<div class="rhead">"<b>${esc(q)}</b>" 관련 자료 <b>${picks.length}개</b>를 찾았어요.</div>` +
      picks.map(x=>{
        const c = CAT[x.r.cat] || CAT.ref;
        const sp = SPACES[x.r.space || c.space || 'ai'] || SPACES.ai;
        const why = x.reason ? `<div class="why-match">💬 <b>${esc(x.reason)}</b></div>`
                  : `<div class="why-match">🔎 일치한 키워드: <b>${x.hit.slice(0,5).map(esc).join(', ')}</b></div>`;
        return `<div class="item-card"><div class="item-main" data-go="${x.i+1}">
          <div class="rtop"><span class="mini ${sp.cls}">${sp.icon} ${sp.short}</span><span class="mini ${c.cls}">${c.label}</span><span class="rno">#${x.i+1}</span></div>
          <span class="rtitle">${x.r.title}</span>
          <div class="rone">${x.r.oneline}</div>${why}
        </div></div>`;
      }).join('');
  }
  resultsEl.querySelector('#askBack').onclick = ()=>{ askSeq++; go(0); };
  resultsEl.querySelectorAll('[data-go]').forEach(b=>{ b.onclick=()=>{ askSeq++; go(parseInt(b.dataset.go)); }; });
  resultsEl.querySelectorAll('[data-k]').forEach(b=>{ b.onclick=()=>{ askText=b.dataset.k; recommend(askText); }; });
}

function localPicks(q){
  const { terms, syn } = parseAsk(q);
  const fullQ = q.toLowerCase().trim();
  return resources.map((r,i)=>{
    const f = fieldsOf(r); let score = 0; const hit = [];
    if (fullQ.length >= 2) {
      f.forEach(([fw, txt]) => { if (txt.includes(fullQ)) { score += fw * 1.5; if (!hit.includes(fullQ)) hit.push(fullQ); } });
    }
    [[terms,1],[syn,.6]].forEach(([list,w])=>list.forEach(t=>{
      let best = 0;
      f.forEach(([fw,txt])=>{ if(txt.includes(t)) best = Math.max(best, fw); });
      if(best){ score += best*w; if(!hit.includes(t)) hit.push(t); }
    }));
    return { i, r, score, hit };
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
}

async function aiPicks(q, pin){
  const catalog = resources.map((r,i)=>({n:i+1, space:r.space||'ai', cat:r.cat, title:stripTags(r.title), oneline:stripTags(r.oneline), what:stripTags(r.what).slice(0,160)}));
  const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 45000);
  try{
    const res = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},signal:ctl.signal,
      body:JSON.stringify({action:'recommend', query:q, pin, catalog})});
    const d = await res.json();
    if(!d.ok || !Array.isArray(d.picks)) return null;
    return d.picks.filter(x=>resources[x.n-1]).slice(0,5).map(x=>({i:x.n-1, r:resources[x.n-1], reason:String(x.reason||'')}));
  }catch(e){ return null; }
  finally{ clearTimeout(to); }
}

async function recommend(q){
  q = q.trim();
  if(!q) return;
  const my = ++askSeq;
  window.scrollTo({top:0});
  const pin = getSavedPin();
  const local = localPicks(q);
  if(!pin){
    showPicks(q, local, '💡 키워드 기준으로 찾은 결과예요. (한 번이라도 자료를 추가해 PIN이 저장되면 AI 문맥 추천도 함께 작동해요)');
    return;
  }
  showPicks(q, local, '🤖 AI가 설명에 가장 잘 맞는 자료를 고르는 중이에요…');
  const ai = await aiPicks(q, pin);
  if(my !== askSeq) return;
  if(ai && ai.length) showPicks(q, ai, '🤖 AI가 설명을 읽고 골랐어요.');
  else showPicks(q, local, '');
}

/* ---------- 구글 시트 연동 & 캡처 업로드 처리 ---------- */
const API = "https://script.google.com/macros/s/AKfycbw97rA1Km3xZg3Y6SkNkUqPWx6qeSO-EMPJGQKYEeikbMbXDZHcHzrxXGQV5PXfoFia/exec";
const safeUrl = u => /^https?:\/\//i.test(u) ? esc(u).replace(/"/g,'%22') : '';

function toRes(it){
  const d = it.detail || {}, list = a => (a||[]).map(esc);
  const cat = CAT[it.cat] ? it.cat : (CAT[d.cat] ? d.cat : 'ref');
  const space = SPACES[it.space] ? it.space : (SPACES[d.space] ? d.space : (CAT[cat] ? CAT[cat].space : 'ai'));
  const cleanUrl = safeUrl(it.url);
  const r = {
    id: it.id,
    date: it.date || '',
    space: space,
    cat: cat,
    title: esc(it.title),
    oneline: esc(it.oneline),
    memo: it.memo || '',
    notes: [],
    links: cleanUrl ? [{t:'원문 열기', u:cleanUrl}] : [],
    starred: Boolean(d.starred),
    sourceType: d.sourceType || (cleanUrl ? 'link' : 'memo'),
    thumbs: Array.isArray(d.thumbs) ? d.thumbs : [],
    tags: Array.isArray(d.tags) ? d.tags : [],
    added: true
  };
  if(d.what) r.what = esc(d.what);
  if(d.why) r.why = list(d.why);
  if(d.steps) r.steps = list(d.steps);
  if(Array.isArray(d.prompts)){
    r.prompts = d.prompts.map(p=>({label:esc(p.label||'프롬프트/발췌'), body:String(p.body||'')}));
  }
  if(d.notes) r.notes = list(d.notes);
  return r;
}

function addOrUpdateResource(it){
  const r = toRes(it);
  const existIdx = resources.findIndex(x => x.id && x.id === r.id);
  if (existIdx >= 0) {
    resources[existIdx] = r;
    return existIdx + 1;
  } else {
    resources.push(r);
    total = resources.length + 1;
    return resources.length;
  }
}

fetch(API).then(r=>r.json()).then(d=>{
  if(!d.ok) return;
  d.items.forEach(it => {
    // 이전에 본문 추출 실패로 중복 등록된 워크숍 빈 항목(f7b91b51)은 기본 14번 자료와 중복이므로 건너뜀
    if (it.id === 'f7b91b51' && !it.detail) return;
    addOrUpdateResource(it);
  });
  if(idx===0 && hashIdx()>0) idx = clampIdx(hashIdx());
  render(true);
}).catch(()=>{});

/* ---------- 이미지 리사이즈 (Gemini Vision용 + 시트 썸네일용) ---------- */
function resizeImageFile(file, maxDim, quality, mime){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = cv.toDataURL(mime || 'image/jpeg', quality || 0.8);
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let pendingCaptures = []; // [{ file, aiBase64, thumbDataUrl }]
const pvGrid = document.getElementById('pvGrid');
const fFiles = document.getElementById('fFiles');
const dropzone = document.getElementById('dropzone');

function renderPreviews(){
  if (!pendingCaptures.length) {
    pvGrid.hidden = true;
    pvGrid.innerHTML = '';
    return;
  }
  pvGrid.hidden = false;
  pvGrid.innerHTML = pendingCaptures.map((c, i) => `
    <div class="pv-item">
      <img src="${c.thumbDataUrl}" alt="캡처 ${i+1}">
      <button type="button" data-rm="${i}" title="제외">✕</button>
    </div>
  `).join('');
  pvGrid.querySelectorAll('[data-rm]').forEach(b => {
    b.onclick = () => {
      pendingCaptures.splice(parseInt(b.dataset.rm), 1);
      renderPreviews();
    };
  });
}

async function handleImageFiles(fileList){
  const files = Array.from(fileList || []).filter(f => f.type && f.type.startsWith('image/'));
  if (!files.length) return;
  const msg = document.getElementById('addMsg');
  msg.className = 'status-msg';
  msg.textContent = '📸 이미지를 선명하게 준비하는 중…';
  for (const f of files.slice(0, 6 - pendingCaptures.length)) {
    try {
      const aiUrl = await resizeImageFile(f, 1280, 0.82, 'image/jpeg');
      let thumbUrl = await resizeImageFile(f, 520, 0.60, 'image/webp');
      if (thumbUrl.length > 22000) {
        thumbUrl = await resizeImageFile(f, 440, 0.55, 'image/jpeg');
      }
      pendingCaptures.push({
        mimeType: 'image/jpeg',
        aiBase64: aiUrl.split(',')[1],
        thumbDataUrl: thumbUrl
      });
    } catch(e){}
  }
  msg.textContent = `📸 캡처 ${pendingCaptures.length}장 준비 완료! 아래 [✨ AI로 정리·저장]을 누르세요.`;
  renderPreviews();
}

dropzone.onclick = () => fFiles.click();
fFiles.onchange = () => { handleImageFiles(fFiles.files); fFiles.value = ''; };
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files) handleImageFiles(e.dataTransfer.files);
});

// 모달 열려 있을 때 Ctrl+V로 클립보드 캡처 이미지 바로 붙여넣기
window.addEventListener('paste', e => {
  const dlg = document.getElementById('addDlg');
  if (!dlg.open) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const imgFiles = [];
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) imgFiles.push(f);
    }
  }
  if (imgFiles.length) {
    e.preventDefault();
    handleImageFiles(imgFiles);
  }
});

document.getElementById('pasteUrlBtn').onclick = async () => {
  try {
    const t = await navigator.clipboard.readText();
    if (t) document.getElementById('fUrl').value = t.trim();
  } catch(e) {
    document.getElementById('fUrl').focus();
  }
};

const addDlg = document.getElementById('addDlg');
const addMsg = document.getElementById('addMsg');

function openAddModal(openFilePicker){
  addMsg.textContent = ''; addMsg.className = 'status-msg';
  pendingCaptures = [];
  renderPreviews();
  const savedPin = getSavedPin();
  document.getElementById('fPin').value = savedPin;
  document.getElementById('fSpace').value = (curSpace !== 'all') ? curSpace : '';
  document.getElementById('fCat').value = (filter !== 'all') ? filter : '';
  addDlg.showModal();
  if (openFilePicker) {
    setTimeout(() => fFiles.click(), 80);
  }
}

document.getElementById('addBtn').onclick = () => openAddModal(false);
document.getElementById('topCapBtn').onclick = () => openAddModal(true);
document.getElementById('fabCapBtn').onclick = () => openAddModal(true);
document.getElementById('fabLinkBtn').onclick = () => openAddModal(false);
document.getElementById('addCancel').onclick = () => addDlg.close();

document.getElementById('addForm').onsubmit = async e => {
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  const url = v('fUrl').trim();
  const memo = v('fMemo').trim();
  const title = v('fTitle').trim();
  const pin = v('fPin').trim();

  if (!pendingCaptures.length && !url && !memo && !title) {
    addMsg.className = 'status-msg err';
    addMsg.textContent = '📸 캡처 이미지를 선택하거나, 링크 또는 메모를 입력해 주세요.';
    return;
  }

  const goBtn = document.getElementById('addGo');
  goBtn.disabled = true;
  addMsg.className = 'status-msg';
  addMsg.textContent = pendingCaptures.length
    ? `🤖 AI가 캡처 이미지 ${pendingCaptures.length}장의 글자와 내용을 꼼꼼히 읽고 정리하는 중… (약 10~25초)`
    : '🤖 AI가 내용을 읽고 정리하는 중… (약 10~20초)';

  try {
    const payload = {
      url: url,
      title: title,
      space: v('fSpace'),
      cat: v('fCat'),
      memo: memo,
      pin: pin,
      images: pendingCaptures.map(c => ({ mimeType: c.mimeType, data: c.aiBase64 })),
      thumbs: pendingCaptures.slice(0, 3).map(c => c.thumbDataUrl)
    };
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    });
    const d = await res.json();
    if (!d.ok) {
      addMsg.className = 'status-msg err';
      addMsg.textContent = d.error || '저장에 실패했어요.';
      return;
    }
    try { localStorage.setItem('jaryoPin', pin); } catch(e){}
    const newIdx = addOrUpdateResource(d.item);
    ['fUrl','fTitle','fMemo'].forEach(id => document.getElementById(id).value = '');
    pendingCaptures = [];
    renderPreviews();
    addDlg.close();
    // 방금 추가된 자료 상세 화면으로 바로 이동해 AI가 어떻게 정리했는지 보여줌!
    go(newIdx);
  } catch(err) {
    addMsg.className = 'status-msg err';
    addMsg.textContent = '저장하지 못했어요. 네트워크를 확인하고 다시 시도해 주세요.';
  } finally {
    goBtn.disabled = false;
  }
};

/* ---------- 자료 수정 & 삭제 ---------- */
const editDlg = document.getElementById('editDlg');
const editMsg = document.getElementById('editMsg');

function openEditModal(r){
  if (!r || !r.id) return;
  editMsg.textContent = ''; editMsg.className = 'status-msg';
  document.getElementById('eId').value = r.id;
  document.getElementById('eSpace').value = r.space || 'ai';
  document.getElementById('eCat').value = r.cat || 'ref';
  document.getElementById('eTitle').value = stripTags(r.title);
  document.getElementById('eOneline').value = stripTags(r.oneline);
  document.getElementById('eWhat').value = stripTags(r.what || '');
  document.getElementById('eUrl').value = (r.links && r.links[0] && r.links[0].u !== '#') ? r.links[0].u : '';
  document.getElementById('eMemo').value = r.memo || '';
  editDlg.showModal();
}

document.getElementById('editCancel').onclick = () => editDlg.close();
document.getElementById('editForm').onsubmit = async e => {
  e.preventDefault();
  let pin = getSavedPin();
  if (!pin) {
    pin = prompt('자료를 수정하려면 PIN을 입력해 주세요:') || '';
    if (!pin) return;
  }
  const goBtn = document.getElementById('editGo');
  goBtn.disabled = true;
  editMsg.textContent = '저장하는 중…';
  try {
    const v = id => document.getElementById(id).value;
    const res = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'update',
        id: v('eId'),
        space: v('eSpace'),
        cat: v('eCat'),
        title: v('eTitle'),
        oneline: v('eOneline'),
        what: v('eWhat'),
        url: v('eUrl'),
        memo: v('eMemo'),
        pin: pin
      })
    });
    const d = await res.json();
    if (!d.ok) {
      editMsg.className = 'status-msg err';
      editMsg.textContent = d.error || '수정 실패';
      return;
    }
    try { localStorage.setItem('jaryoPin', pin); } catch(e){}
    addOrUpdateResource(d.item);
    editDlg.close();
    render(true);
  } catch(err) {
    editMsg.className = 'status-msg err';
    editMsg.textContent = '수정 중 오류가 발생했어요.';
  } finally {
    goBtn.disabled = false;
  }
};

async function deleteResource(r){
  if (!r || !r.id) return;
  if (!confirm(`정말 "${stripTags(r.title)}" 자료를 삭제할까요?`)) return;
  let pin = getSavedPin();
  if (!pin) {
    pin = prompt('자료를 삭제하려면 PIN을 입력해 주세요:') || '';
    if (!pin) return;
  }
  try {
    const res = await fetch(API, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'delete', id: r.id, pin: pin })
    });
    const d = await res.json();
    if (!d.ok) { alert(d.error || '삭제하지 못했어요.'); return; }
    try { localStorage.setItem('jaryoPin', pin); } catch(e){}
    const delIdx = resources.findIndex(x => x.id === r.id);
    if (delIdx >= 0) {
      resources.splice(delIdx, 1);
      total = resources.length + 1;
    }
    go(0);
  } catch(err) {
    alert('삭제 중 오류가 발생했어요.');
  }
}

/* ---------- URL 공유 파라미터(?url=...&text=...) 자동 인식 ---------- */
(function checkShareParams(){
  try {
    const sp = new URLSearchParams(location.search);
    const sharedUrl = sp.get('url') || '';
    const sharedText = sp.get('text') || '';
    const sharedTitle = sp.get('title') || '';
    if (sharedUrl || sharedText || sp.get('add')) {
      setTimeout(() => {
        openAddModal(false);
        const urlMatch = (sharedUrl + ' ' + sharedText).match(/https?:\/\/[^\s]+/i);
        if (urlMatch) document.getElementById('fUrl').value = urlMatch[0];
        if (sharedText) document.getElementById('fMemo').value = sharedText;
        if (sharedTitle) document.getElementById('fTitle').value = sharedTitle;
      }, 150);
    }
  } catch(e){}
})();

document.getElementById('avaHeader').innerHTML = AVA_IMG;
render(true);
</script>
