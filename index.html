<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선생님의 AI 활용 자료 정리</title>
<style>
  :root{
    --bg:#f2f4f7;
    --card:#ffffff;
    --ink:#1b2430;
    --ink-soft:#5f6a78;
    --line:#e3e7ee;
    --accent:#20406b;          /* point color — navy */
    --accent-deep:#152c49;
    --accent-soft:#e8eef6;
    /* categories: 필수=네이비 포인트, 참고/심화=중성 슬레이트 */
    --c-must:#20406b;      --c-must-bg:#e6edf6;
    --c-ref:#5f6a78;       --c-ref-bg:#edeff3;
    --c-dev:#96a1af;       --c-dev-bg:#f1f3f6;
    --shadow:0 6px 20px rgba(20,35,60,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.65;
  }
  .wrap{max-width:920px; margin:0 auto; padding:22px 18px 120px; min-height:100%;}

  /* Header */
  header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .brand{font-weight:800; letter-spacing:-.02em; font-size:1.02rem;}
  .brand small{display:block; font-weight:500; color:var(--ink-soft); font-size:.78rem; letter-spacing:0;}
  .counter{font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.85rem; background:var(--card); border:1px solid var(--line); padding:6px 12px; border-radius:999px;}

  /* Progress dots / filmstrip */
  .strip{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .strip button{
    width:30px; height:30px; border:1px solid var(--line); background:var(--card);
    border-radius:8px; font-size:.78rem; color:var(--ink-soft); cursor:pointer; font-weight:600;
    transition:.15s; font-variant-numeric:tabular-nums;
  }
  .strip button:hover{border-color:var(--accent); color:var(--accent);}
  .strip button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .strip button.intro{width:auto; padding:0 12px;}

  /* Card */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    box-shadow:var(--shadow); padding:30px 30px 34px; min-height:60vh;
    animation:fade .25s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  .chip{display:inline-flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; padding:5px 11px; border-radius:999px; margin-bottom:14px;}
  .chip.must{color:var(--c-must); background:var(--c-must-bg);}
  .chip.ref{color:var(--c-ref); background:var(--c-ref-bg);}
  .chip.dev{color:var(--c-dev); background:var(--c-dev-bg);}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .num{font-size:.82rem; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  h1.title{font-size:1.7rem; letter-spacing:-.02em; line-height:1.25; margin-bottom:10px; font-weight:800;}
  .oneline{font-size:1.02rem; color:var(--ink-soft); margin-bottom:22px;}

  .sec{margin-top:22px;}
  .sec h3{
    font-size:.82rem; font-weight:800; color:var(--accent); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .sec h3::before{content:""; width:16px; height:2px; background:var(--accent); border-radius:2px;}
  .sec p{margin-bottom:8px;}
  .sec ul{list-style:none;}
  .sec ul li{position:relative; padding-left:20px; margin-bottom:9px;}
  .sec ul li::before{content:""; position:absolute; left:4px; top:.62em; width:6px; height:6px; background:var(--accent); border-radius:50%;}

  /* steps */
  ol.steps{list-style:none; counter-reset:s;}
  ol.steps li{position:relative; padding-left:38px; margin-bottom:12px; counter-increment:s;}
  ol.steps li::before{
    content:counter(s); position:absolute; left:0; top:-1px; width:26px; height:26px;
    background:var(--accent-soft); color:var(--accent); border-radius:8px; font-weight:800;
    font-size:.85rem; display:flex; align-items:center; justify-content:center;
  }
  code{background:#eef1f5; padding:1.5px 7px; border-radius:6px; font-size:.86em; font-family:"SFMono-Regular",Consolas,monospace; color:#20406b; word-break:break-all;}

  /* prompt box */
  .prompt{background:#1b2a40; color:#dbe4f0; border-radius:12px; padding:16px 18px; margin:6px 0 12px; font-size:.9rem; white-space:pre-wrap; font-family:"SFMono-Regular",Consolas,monospace; line-height:1.55;}
  details{border:1px solid var(--line); border-radius:12px; padding:2px 16px; margin-top:10px; background:#f5f7fa;}
  details summary{cursor:pointer; font-weight:700; padding:12px 0; font-size:.92rem; list-style:none;}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ "; color:var(--accent);}
  details[open] summary::before{content:"▾ ";}

  .caution{background:#f1f4f8; border:1px solid #e3e7ee; border-left:3px solid var(--accent); border-radius:12px; padding:14px 16px; margin-top:8px; font-size:.92rem;}
  .caution strong{color:var(--accent-deep);}

  .links a{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-weight:600; font-size:.92rem; border:1px solid var(--line); padding:8px 14px; border-radius:10px; margin:5px 8px 0 0; background:#fff; word-break:break-all;}
  .links a:hover{background:var(--accent-soft); border-color:var(--accent);}

  /* intro specifics */
  .intro-lead{font-size:1.12rem; line-height:1.7; margin-bottom:8px;}
  .prio{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
  .prio .row{border:1px solid var(--line); border-radius:14px; padding:16px 18px; background:#f5f7fa;}
  .prio .row .lbl{font-weight:800; font-size:.92rem; margin-bottom:4px; display:flex; align-items:center; gap:8px;}
  .prio .row .lbl .dot{width:9px;height:9px;border-radius:50%;}
  .howto{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .howto .k{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:.86rem; color:var(--ink-soft);}
  .howto .k b{color:var(--ink);}

  /* teacher illustration */
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .ava{width:46px; height:46px; border-radius:50%; overflow:hidden; flex:0 0 auto; border:1px solid var(--line); background:var(--accent-soft);}
  .brand .ava img{width:100%; height:100%; object-fit:cover; display:block;}
  .brand .btxt{font-weight:800; letter-spacing:-.02em; font-size:1.02rem; line-height:1.25;}

  .hero{display:flex; align-items:center; gap:20px; background:var(--accent-soft); border-radius:16px; padding:20px 24px; margin-bottom:22px;}
  .hero .txt{flex:1; min-width:0;}
  .hero .txt .hi{font-weight:800; font-size:1.18rem; letter-spacing:-.01em; margin-bottom:6px;}
  .hero .txt .sub{color:var(--ink-soft); font-size:.94rem; line-height:1.6;}
  .hero .art{flex:0 0 auto; width:126px; height:190px; border-radius:14px; overflow:hidden; border:2px solid #fff; box-shadow:0 2px 10px rgba(20,35,60,.13); background:#fff;}
  .hero .art img{width:100%; height:100%; object-fit:cover; object-position:top center; display:block;}
  @media (max-width:560px){ .hero{flex-direction:column-reverse; text-align:center;} .hero .txt .sub{font-size:.9rem;} }

  /* nav bar */
  nav.bottom{position:fixed; left:0; right:0; bottom:0; background:rgba(242,244,247,.92); backdrop-filter:blur(8px); border-top:1px solid var(--line); padding:12px 16px;}
  nav.bottom .inner{max-width:920px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  nav.bottom button{font-family:inherit; font-weight:700; font-size:.92rem; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:11px 20px; border-radius:12px; cursor:pointer; transition:.15s;}
  nav.bottom button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  nav.bottom button:disabled{opacity:.38; cursor:default;}
  nav.bottom .mid{font-size:.82rem; color:var(--ink-soft); text-align:center;}

  /* search */
  .searchbar{position:relative; margin-bottom:16px;}
  .searchbar input{
    width:100%; font-family:inherit; font-size:1rem; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 46px 14px 16px; box-shadow:var(--shadow); outline:none; transition:.15s;
  }
  .searchbar input:focus{border-color:var(--accent);}
  .searchbar input::placeholder{color:#a6a6a6;}
  .searchbar .clr{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    border:none; background:#eef1f5; color:var(--ink-soft); border-radius:9px;
    padding:7px 12px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .searchbar .clr:hover{background:var(--accent-soft); color:var(--accent);}

  .results{animation:fade .2s ease;}
  .results .rhead{color:var(--ink-soft); font-size:.9rem; margin-bottom:12px; padding:0 2px;}
  .results .rhead b{color:var(--accent);}
  .result-item{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:16px 18px; margin-bottom:12px; transition:.15s;
    font-family:inherit;
  }
  .result-item:hover{border-color:var(--accent); transform:translateY(-1px);}
  .result-item .rtop{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .result-item .rtitle{font-weight:800; font-size:1.05rem; letter-spacing:-.01em;}
  .result-item .rone{color:var(--ink-soft); font-size:.9rem; line-height:1.5;}
  .result-item .rsnip{margin-top:8px; font-size:.86rem; color:var(--ink-soft); background:#f5f7fa; border:1px solid var(--line); border-radius:9px; padding:8px 11px;}
  .result-item mark{background:var(--accent-soft); color:var(--accent-deep); font-weight:700; padding:0 3px; border-radius:3px;}
  .result-item .mini{font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px;}
  .mini.must{color:var(--c-must); background:var(--c-must-bg);}
  .mini.ref{color:var(--c-ref); background:var(--c-ref-bg);}
  .mini.dev{color:var(--c-dev); background:var(--c-dev-bg);}
  .result-item .rno{font-size:.78rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .noresult{text-align:center; color:var(--ink-soft); padding:50px 20px; background:var(--card); border:1px solid var(--line); border-radius:16px;}
  .noresult .big{font-size:1.6rem; margin-bottom:8px;}
  .chiprow{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; justify-content:center;}
  .chiprow button{border:1px solid var(--line); background:#f5f7fa; border-radius:999px; padding:6px 13px; font-size:.82rem; cursor:pointer; font-family:inherit; color:var(--ink-soft);}
  .chiprow button:hover{border-color:var(--accent); color:var(--accent);}

  @media (max-width:560px){
    .card{padding:24px 20px 28px;}
    h1.title{font-size:1.42rem;}
    .wrap{padding-top:16px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="ava" id="avaHeader"></span>
      <span class="btxt">선생님의 AI 활용 자료 정리
        <small>모아둔 자료를 실무에 바로 쓰도록 세팅법까지 정리 · 넘겨서 보기</small>
      </span>
    </div>
    <div class="counter" id="counter">– / –</div>
  </header>

  <div class="searchbar">
    <input id="search" type="search" placeholder="🔍 검색 — 예: 프롬프트, PPT, 생기부, 노션, 무료" autocomplete="off" spellcheck="false">
    <button id="clearSearch" class="clr" hidden>지우기 ✕</button>
  </div>

  <div class="strip" id="strip"></div>

  <main class="card" id="card"><!-- rendered --></main>
  <section class="results" id="results" hidden></section>
</div>

<nav class="bottom">
  <div class="inner">
    <button id="prev">← 이전</button>
    <div class="mid" id="midlabel">← → 방향키로도 넘길 수 있어요</div>
    <button id="next">다음 →</button>
  </div>
</nav>

<script>
/* =========================================================================
   자료 추가 방법 (나중에 새 자료가 생기면):
   아래 resources 배열 맨 끝에 { ... } 하나를 복사해 붙이고 내용만 바꾸면 됩니다.
   - cat: "must"(교사 필수) / "ref"(실무 참고) / "dev"(개발·심화)
   - steps, why, notes, prompts 는 없으면 빈 배열 [] 또는 생략 가능
   ========================================================================= */
const resources = [
  {
    cat:"must",
    title:"선생님의 Claude Cowork 활용 (33슬라이드)",
    oneline:"현직 교사가 만든 실전 가이드. 생기부·PAPS·지도안·학부모·평가까지 복붙 프롬프트 포함. 이 묶음의 핵심 자료.",
    what:"Cowork는 내 PC 파일을 직접 읽고·만들고, 여러 단계를 알아서 끝까지 처리하고, 앱·인터넷과 연결하고, 정해진 시간에 자동 반복까지 하는 'AI 동료'입니다. 챗은 '답을 주는 것', 코워크는 '일을 끝내주는 것'이라고 보면 됩니다. (Pro 이상 유료, 데스크톱·웹·모바일)",
    why:[
      "관찰 메모 폴더를 읽어 학생 30명 생기부 초안을 한 번에 자동 생성",
      "PAPS 엑셀을 읽어 학생별 체력 분석 보고서를 자동 작성",
      "매주 월요일 학급 안내문·매일 아침 교육 정보 브리핑을 예약 자동 실행"
    ],
    steps:[
      "읽는 파일 형식 확인: .docx · .xlsx · .pdf(텍스트) · .jpg · .png · .txt (손글씨·도장 스캔은 인식 못 함)",
      "예약 작업: Cowork 탭 → <code>+ New task</code> → 내용 입력 → 입력창에 <code>/schedule</code> → 주기 선택(daily·weekly·weekdays) → Schedule",
      "나만의 스킬 저장: Settings → Skills → <code>+ New skill</code> → 이름 + 내 문체·양식·학교명 설명 저장 → 이후 한 마디로 자동 적용",
      "커넥터 연결: 입력창 <code>+</code> → Connectors → Manage → Gmail·Calendar·Drive → Connect → 구글 로그인 (Gmail은 읽기·초안까지만, 자동 발송은 막힘)",
      "카카오톡 등은 MCP로: 입력창 <code>+</code> → Extensions에서 검색·설치"
    ],
    prompts:[
      {label:"생기부 — 관찰 메모 → 교과세특 초안", body:
`아래 관찰 메모를 학생별 교과세특 문장으로 바꿔줘.
조건: 공식 문체, 3인칭 서술, 학생당 200~300자,
구체적 활동·역량 중심으로

[홍길동] 배드민턴 서브 자세 정확. 팀원에게 동작 설명.
[이영희] 처음 어려워했으나 3차시 후 개선. 질문 적극적.`},
      {label:"수업 — 지도안 자동 생성", body:
`체육 2학년 3반 28명, 배드민턴 3/8차시
학습목표: 언더핸드 스트로크 정확히 수행
성취기준: [9체02-03]  수업 장소: 체육관, 45분

위 내용으로 수업 지도안 Word 파일 만들어줘.
도입5분/전개35분/정리5분, 교사활동·학생활동·지도유의점 포함.
바탕화면에 저장. 파일명: 지도안_배드민턴_3차시.docx`},
      {label:"학부모 — 주간 학급 안내문(매주 월요일 예약)", body:
`내 구글 캘린더에서 이번 주(월~금) 일정 가져와서
2학년 3반 학부모 공유용 주간 안내문 만들어줘.
형식: 이번 주 주요 일정(날짜·내용), 준비물 및 유의사항
친근한 말투, A4 1장 Word 파일로 바탕화면에 저장.`}
    ],
    notes:[
      "예약 작업 중 <strong>웹검색·Gmail·캘린더만</strong> 쓰면 PC를 꺼도 클라우드에서 정시 실행됩니다.",
      "반대로 <strong>바탕화면 파일 저장·카카오톡 발송</strong>을 쓰는 예약은 그 시각에 PC가 켜져 있고 데스크톱 앱이 열려 있어야 합니다."
    ],
    links:[{t:"자료 원문 (33슬라이드)", u:"https://kimju1416.github.io/cowork/"}]
  },

  {
    cat:"must",
    title:"교과서 PDF → Claude+Notion 수업자료 자동 생성",
    oneline:"교과서·시험범위 PDF 하나로 수업자료·예습/복습 자료·문제집까지 자동으로 만드는 교사 워크플로. Claude·Notion 무료 플랜만으로 가능.",
    what:"교과서나 시험범위 PDF를 Claude에 넣고 Notion과 연동해, 수업자료·예습/복습 자료·문제집을 자동으로 만드는 방법입니다. 한 번 프롬프트를 만들어두면 매년 재사용할 수 있고, 교사는 자료 생성을 AI에 맡기고 학생과의 상호작용에 집중할 수 있습니다.",
    why:[
      "교사: 개념정리·퀴즈·비교분석 자료를 5분 안에 초안 생성",
      "학생용: 시험범위 요점 정리, 예습·복습 자료, 문제집 제공",
      "한 번 만든 프롬프트를 매년 반복 사용"
    ],
    steps:[
      "Claude에 Notion 커넥터 연결 (자료 '선생님의 Cowork 활용'의 커넥터 연결 참고)",
      "교과서/시험범위 PDF를 대화에 첨부",
      "목적별 프롬프트로 요청: 개념정리 · 퀴즈 · 비교분석 · 예습/복습 · 문제집",
      "결과를 Notion 페이지로 정리 → 학생·학부모에게 공유 링크 제공"
    ],
    notes:[
      "무료 플랜(Claude·Notion)만으로 가능하다고 안내됩니다.",
      "복붙 가능한 프롬프트 모음(수능대비·개념정리·퀴즈 등)과 Notion 연결법 상세본은 원작 게시물(@hirame.ki) 댓글 'DM'으로 공유됩니다."
    ],
    links:[{t:"소개 게시물(Instagram)", u:"https://www.instagram.com/p/DYgqyldlGAJ/"}]
  },

  {

function introHTML(){
  const must = resources.filter(r=>r.cat==='must').length;
  const ref = resources.filter(r=>r.cat==='ref').length;
  const dev = resources.filter(r=>r.cat==='dev').length;
  return `
    <div class="hero">
      <div class="txt">
        <div class="hi">반가워요, 선생님 👋</div>
        <div class="sub">여기저기서 모은 AI 자료를 한곳에 모아, 실제 수업·행정에 바로 쓰도록 정리했어요. 위 검색창이나 아래 <b>다음 →</b>으로 넘겨보세요.</div>
      </div>
      <div class="art">${HERO_IMG}</div>
    </div>
    <span class="chip must"><span class="dot"></span>시작하기</span>
    <h1 class="title">모아둔 AI 자료, 실무에 쓰도록 정리했어요</h1>
    <p class="intro-lead">여기저기서 모은 자료 ${resources.length}개를 <b>선생님 실무 활용도 순서</b>로 재구성하고, 각 자료를 실제로 세팅하는 방법까지 담았어요. 아래에서 <b>다음 →</b> 또는 방향키로 넘겨보세요.</p>

    <div class="sec">
      <h3>이렇게 분류했어요</h3>
      <div class="prio">
        <div class="row"><div class="lbl"><span class="dot" style="background:var(--c-must)"></span>교사 필수 · ${must}개</div>지금 바로 수업·행정에 쓸 수 있는 것 — Cowork 활용, 교과서 PDF→수업자료, 페이블 모드, 교육청 평가계획서 도구</div>
        <div class="row"><div class="lbl"><span class="dot" style="background:var(--c-ref)"></span>실무 참고 · ${ref}개</div>알아두면 문서·자료 작업이 편해지는 것 — 클로드 스킬, 글쓰기 스킬, PPT 제작·색조합, 프롬프트 코드, NotebookLM, Snipaste</div>
        <div class="row"><div class="lbl"><span class="dot" style="background:var(--c-dev)"></span>개발·심화 · ${dev}개</div>주로 코딩·터미널용. 개념 참고 정도로 — 클로드코드 셋팅, 디자인 스킬, ECC</div>
      </div>
    </div>

    <div class="sec">
      <h3>보는 방법</h3>
      <div class="howto">
        <div class="k"><b>다음/이전</b> 버튼 또는 <b>← →</b> 방향키</div>
        <div class="k">위쪽 <b>번호</b>를 눌러 바로 이동</div>
        <div class="k">각 자료의 <b>세팅 순서</b>를 그대로 따라 하면 됩니다</div>
      </div>
    </div>

    <div class="caution" style="margin-top:22px;">📌 새 자료가 생기면 계속 <strong>추가</strong>할 수 있게 만들었어요. 링크를 더 보내주시면 이 문서에 이어서 채워 넣을게요.</div>
  `;
}

function resHTML(r){
  const c = CAT[r.cat];
  let h = `<span class="chip ${c.cls}"><span class="dot"></span>${c.label}</span>`;
  h += `<div class="num">자료</div>`;
  h += `<h1 class="title">${r.title}</h1>`;
  h += `<p class="oneline">${r.oneline}</p>`;
  if(r.what){ h += `<div class="sec"><h3>무엇인가요</h3><p>${r.what}</p></div>`; }
  if(r.why && r.why.length){ h += `<div class="sec"><h3>선생님께 왜 좋은가요</h3><ul>${r.why.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }
  if(r.extra && r.extra.length){ r.extra.forEach(sec=>{ h += `<div class="sec"><h3>${sec.h}</h3><ul>${sec.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`; }); }
  if(r.steps && r.steps.length){ h += `<div class="sec"><h3>세팅 순서</h3><ol class="steps">${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`; }
  if(r.prompts && r.prompts.length){
    h += `<div class="sec"><h3>바로 쓰는 프롬프트</h3>`;
    h += r.prompts.map(p=>`<details><summary>${p.label}</summary><div class="prompt">${p.body.replace(/</g,'&lt;')}</div></details>`).join('');
    h += `</div>`;
  }
  if(r.notes && r.notes.length){ h += `<div class="sec"><h3>알아둘 점</h3>${r.notes.map(x=>`<div class="caution">${x}</div>`).join('')}</div>`; }
  if(r.links && r.links.length){ h += `<div class="sec links"><h3>링크</h3>${r.links.map(l=>`<a href="${l.u}" target="_blank" rel="noopener">🔗 ${l.t}</a>`).join('')}</div>`; }
  return h;
}

function buildStrip(){
  strip.innerHTML = '';
  const intro = document.createElement('button');
  intro.className='intro'; intro.textContent='시작';
  intro.onclick=()=>go(0);
  strip.appendChild(intro);
  resources.forEach((r,i)=>{
    const b=document.createElement('button');
    b.textContent=(i+1);
    b.style.borderColor = (r.cat? '': '');
    b.onclick=()=>go(i+1);
    strip.appendChild(b);
  });
}

function render(){
  if(idx===0){ card.innerHTML = introHTML(); }
  else { card.innerHTML = resHTML(resources[idx-1]); }
  counter.textContent = `${idx===0?'시작':idx} / ${resources.length}`;
  [...strip.children].forEach((b,i)=>b.classList.toggle('active', i===idx));
  prevBtn.disabled = idx===0;
  nextBtn.disabled = idx===total-1;
  window.scrollTo({top:0, behavior:'smooth'});
}
function go(i){ idx = Math.max(0, Math.min(total-1, i)); render(); }

prevBtn.onclick=()=>go(idx-1);
nextBtn.onclick=()=>go(idx+1);
document.addEventListener('keydown',e=>{
  // ignore while searching or typing in the search box
  if(!document.getElementById('results').hidden) return;
  if(document.activeElement && document.activeElement.id==='search') return;
  if(e.key==='ArrowRight') go(idx+1);
  if(e.key==='ArrowLeft') go(idx-1);
});

/* ---------- search ---------- */
const searchEl = document.getElementById('search');
const clearEl = document.getElementById('clearSearch');
const resultsEl = document.getElementById('results');
const stripEl = document.getElementById('strip');

function stripTags(s){ return String(s||'').replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// build a plain-text blob per resource for searching
const index = resources.map((r,i)=>{
  let parts = [r.title, r.oneline, r.what, CAT[r.cat].label];
  (r.why||[]).forEach(x=>parts.push(x));
  (r.steps||[]).forEach(x=>parts.push(x));
  (r.notes||[]).forEach(x=>parts.push(x));
  (r.extra||[]).forEach(sec=>{ parts.push(sec.h); (sec.items||[]).forEach(x=>parts.push(x)); });
  (r.prompts||[]).forEach(p=>{ parts.push(p.label); parts.push(p.body); });
  (r.links||[]).forEach(l=>parts.push(l.t));
  const plain = stripTags(parts.join('  •  '));
  return { i, r, plain, lower: plain.toLowerCase() };
});

function snippet(plain, tokens){
  const lower = plain.toLowerCase();
  let pos = -1;
  for(const t of tokens){ const p = lower.indexOf(t); if(p>=0){ pos = p; break; } }
  if(pos<0) return '';
  const start = Math.max(0, pos-30);
  let frag = plain.slice(start, pos+90);
  if(start>0) frag = '…'+frag;
  if(pos+90 < plain.length) frag = frag+'…';
  frag = esc(frag);
  tokens.forEach(t=>{
    if(!t) return;
    const re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    frag = frag.replace(re,'<mark>$1</mark>');
  });
  return frag;
}

function doSearch(q){
  const query = q.trim();
  clearEl.hidden = query.length===0;
  document.querySelector('nav.bottom').style.display = query.length? 'none':'';
  if(query.length===0){ // restore deck
    resultsEl.hidden = true;
    stripEl.hidden = false;
    card.hidden = false;
    render();
    return;
  }
  const tokens = query.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = index.filter(x => tokens.every(t => x.lower.includes(t)));
  // show results view
  stripEl.hidden = true;
  card.hidden = true;
  resultsEl.hidden = false;
  if(hits.length===0){
    resultsEl.innerHTML = `<div class="noresult"><div class="big">🔍</div>
      "<b>${esc(query)}</b>"에 대한 자료를 찾지 못했어요.<br>다른 낱말로 검색해 보세요.
      <div class="chiprow">${['프롬프트','PPT','생기부','노션','수업','평가','무료','스킬'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`;
  } else {
    resultsEl.innerHTML = `<div class="rhead"><b>${hits.length}개</b> 자료를 찾았어요. 눌러서 바로 열어보세요.</div>` +
      hits.map(x=>{
        const c = CAT[x.r.cat];
        const sn = snippet(x.plain, tokens);
        return `<button class="result-item" data-go="${x.i+1}">
          <div class="rtop"><span class="mini ${c.cls}">${c.label}</span><span class="rno">${x.i+1}번</span><span class="rtitle">${esc(x.r.title)}</span></div>
          <div class="rone">${esc(x.r.oneline)}</div>
          ${sn?`<div class="rsnip">${sn}</div>`:''}
        </button>`;
      }).join('');
  }
  // wire clicks
  resultsEl.querySelectorAll('[data-go]').forEach(b=>{
    b.onclick=()=>{ searchEl.value=''; doSearch(''); go(parseInt(b.dataset.go)); };
  });
  resultsEl.querySelectorAll('[data-k]').forEach(b=>{
    b.onclick=()=>{ searchEl.value=b.dataset.k; doSearch(b.dataset.k); };
  });
}

searchEl.addEventListener('input', e=>doSearch(e.target.value));
clearEl.addEventListener('click', ()=>{ searchEl.value=''; doSearch(''); searchEl.focus(); });

document.getElementById('avaHeader').innerHTML = AVA_IMG;
buildStrip();
render();
</script>
</body>
